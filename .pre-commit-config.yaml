# Pre-commit configuration for LOOP
repos:
  - repo: local
    hooks:
      - id: copyright-header-check
        name: Check Copyright Headers
        entry: apps/api/.venv/Scripts/python scripts/check_copyright_headers.py
        language: system
        pass_filenames: true
        types_or: [python, javascript, ts, tsx, css]
        exclude: ^(\.agent/|\.venv/|node_modules/|\.next/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 26.10.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, ts, tsx, css, json, yaml, markdown]
        exclude: ^(\.agent/|apps/web/\.next/|apps/web/node_modules/|package-lock\.json)
