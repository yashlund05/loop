name: CI Pipeline

on:
  push:
    branches: ["main", "phase-*/**", "phase-*"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend (FastAPI / Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pip-audit

      - name: Check Copyright Headers
        run: python scripts/check_copyright_headers.py

      - name: Lint with Ruff
        run: ruff check apps/api

      - name: Check Formatting with Black
        run: black --check apps/api

      - name: Type Check with Mypy
        working-directory: apps/api
        run: mypy app

      - name: Verify Alembic Migrations (Offline DDL)
        working-directory: apps/api
        run: alembic upgrade head --sql

      - name: Run Pytest
        working-directory: apps/api
        run: pytest -v

      - name: Run pip-audit
        run: pip-audit -r apps/api/requirements.txt

  frontend:
    name: Frontend (Next.js / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Type Check with TypeScript
        working-directory: apps/web
        run: npm run type-check

      - name: Lint with ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Build Next.js Production App
        working-directory: apps/web
        run: npm run build

      - name: Production Security Audit (Blocking)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

      - name: Full Dependency Audit (Informational / Non-Blocking)
        working-directory: apps/web
        run: npm audit || true

  docker-compose-test:
    name: Docker Compose Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Environment Template
        run: cp .env.example .env

      - name: Build and Start Containers
        run: docker compose up -d --build

      - name: Wait for API and Verify /health (HTTP 200)
        run: |
          echo "Waiting for API service at http://localhost:8000/health..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "API is healthy (HTTP 200)"
              break
            fi
            echo "Attempt $i: received status $STATUS. Retrying in 2s..."
            sleep 2
          done
          FINAL_API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
          if [ "$FINAL_API_STATUS" -ne 200 ]; then
            echo "ERROR: API /health returned status $FINAL_API_STATUS (expected 200)"
            docker compose logs api
            exit 1
          fi

      - name: Wait for Web and Verify Root (HTTP 200)
        run: |
          echo "Waiting for Web service at http://localhost:3000/..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Web root is reachable (HTTP 200)"
              break
            fi
            echo "Attempt $i: received status $STATUS. Retrying in 2s..."
            sleep 2
          done
          FINAL_WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
          if [ "$FINAL_WEB_STATUS" -ne 200 ]; then
            echo "ERROR: Web root returned status $FINAL_WEB_STATUS (expected 200)"
            docker compose logs web
            exit 1
          fi

      - name: Tear Down Containers
        if: always()
        run: docker compose down
