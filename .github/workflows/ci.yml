name: CI Pipeline

on:
  push:
    branches: ["main", "phase-*/**", "phase-*"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend (FastAPI / Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pip-audit

      - name: Check Copyright Headers
        run: python scripts/check_copyright_headers.py

      - name: Lint with Ruff
        run: ruff check apps/api

      - name: Check Formatting with Black
        run: black --check apps/api

      - name: Type Check with Mypy
        working-directory: apps/api
        run: mypy app

      - name: Verify Alembic Migrations (Offline DDL)
        working-directory: apps/api
        run: alembic upgrade head --sql

      - name: Run Pytest
        working-directory: apps/api
        run: pytest -v

      - name: Run pip-audit
        run: pip-audit -r apps/api/requirements.txt

  frontend:
    name: Frontend (Next.js / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Type Check with TypeScript
        working-directory: apps/web
        run: npm run type-check

      - name: Lint with ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Build Next.js Production App
        working-directory: apps/web
        run: npm run build

      - name: Run npm audit
        working-directory: apps/web
        run: npm audit --audit-level=moderate
